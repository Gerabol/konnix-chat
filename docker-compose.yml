name: konnix

services:
  postgres:
    image: postgres:16
    container_name: konnix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: konnix
      POSTGRES_PASSWORD: konnix
      POSTGRES_DB: konnix
    volumes:
      - konnix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konnix -d konnix"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - konnix_network

  backend:
    build:
      context: ./backend
    container_name: konnix-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/konnix
      SPRING_DATASOURCE_USERNAME: konnix
      SPRING_DATASOURCE_PASSWORD: konnix

      KONNIX_UPLOADS_DIR: /tmp/konnix-uploads

      KONNIX_ADMIN_USERNAME: ${KONNIX_ADMIN_USERNAME:-admin}
      KONNIX_ADMIN_NAME: ${KONNIX_ADMIN_NAME:-Administrador}
      KONNIX_ADMIN_EMAIL: ${KONNIX_ADMIN_EMAIL:-admin@konnix.local}
      KONNIX_ADMIN_PASSWORD: ${KONNIX_ADMIN_PASSWORD:-}

      KONNIX_VAPID_PUBLIC_KEY: ${KONNIX_VAPID_PUBLIC_KEY:-}
      KONNIX_VAPID_PRIVATE_KEY: ${KONNIX_VAPID_PRIVATE_KEY:-}
      KONNIX_VAPID_SUBJECT: ${KONNIX_VAPID_SUBJECT:-mailto:konnix@konnix.local}

    ports:
      - "8081:8080"

    volumes:
      - konnix_uploads:/app/uploads

    networks:
      - konnix_network

  frontend:
    build:
      context: ./frontend

    container_name: konnix-frontend
    restart: unless-stopped

    depends_on:
      - backend

    environment:
      # Empty means each browser uses the hostname it used to open the frontend.
      # This keeps remote clients from calling their own localhost.
      VITE_API_URL: ""
      VITE_BACKEND_URL: http://backend:8080
      VITE_WS_URL: ""

    ports:
      - "5174:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    command: ["sh", "-c", "npm ci --legacy-peer-deps && npm run dev -- --host 0.0.0.0"]

    networks:
      - konnix_network

networks:
  konnix_network:
    name: konnix_network
    driver: bridge

volumes:
  konnix_postgres_data:
    name: konnix_postgres_data

  konnix_uploads:
    name: konnix_uploads
