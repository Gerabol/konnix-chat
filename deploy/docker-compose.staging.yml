name: konnix-staging

services:
  postgres:
    image: postgres:16
    container_name: konnix-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-konnix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ERRO: POSTGRES_PASSWORD obrigatorio no deploy/.env.staging}
      POSTGRES_DB: ${POSTGRES_DB:-konnix_staging}
    volumes:
      - konnix_staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-konnix} -d ${POSTGRES_DB:-konnix_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - konnix_staging_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: konnix-staging-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-konnix_staging}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-konnix}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?ERRO: POSTGRES_PASSWORD obrigatorio no deploy/.env.staging}

      KONNIX_UPLOADS_DIR: /app/uploads

      KONNIX_ADMIN_USERNAME: ${KONNIX_ADMIN_USERNAME:-admin}
      KONNIX_ADMIN_NAME: ${KONNIX_ADMIN_NAME:-Administrador Homologação}
      KONNIX_ADMIN_EMAIL: ${KONNIX_ADMIN_EMAIL:-admin-homolog@konnix.local}
      KONNIX_ADMIN_PASSWORD: ${KONNIX_ADMIN_PASSWORD:-}

      KONNIX_VAPID_PUBLIC_KEY: ${KONNIX_VAPID_PUBLIC_KEY:-}
      KONNIX_VAPID_PRIVATE_KEY: ${KONNIX_VAPID_PRIVATE_KEY:-}
      KONNIX_VAPID_SUBJECT: ${KONNIX_VAPID_SUBJECT:-mailto:homolog@konnix.local}

    # Bind estrito em loopback 127.0.0.1 (SEC-03: impede exposição indevida na rede local)
    ports:
      - "127.0.0.1:${STAGING_BACKEND_PORT:-8082}:8080"

    volumes:
      - konnix_staging_uploads:/app/uploads

    # Healthcheck para sincronizar inicialização com o Nginx (INCONS-03)
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8080/api/public/server-info > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

    networks:
      - konnix_staging_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: konnix-staging-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Bind estrito em loopback 127.0.0.1 (SEC-03)
    ports:
      - "127.0.0.1:${STAGING_FRONTEND_PORT:-5175}:80"
    networks:
      - konnix_staging_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: konnix-staging-cloudflared
    restart: unless-stopped
    depends_on:
      - frontend
    command: ["tunnel", "--no-autoupdate", "--url", "http://frontend:80"]
    networks:
      - konnix_staging_net

networks:
  konnix_staging_net:
    name: konnix_staging_net
    driver: bridge

volumes:
  konnix_staging_postgres_data:
    name: konnix_staging_postgres_data
  konnix_staging_uploads:
    name: konnix_staging_uploads
