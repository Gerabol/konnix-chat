name: CI - Verificação Contínua

on:
  pull_request:
    branches:
      - main
      - homologacao
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'chore/**'

jobs:
  backend-ci:
    name: Backend CI (Java 21 / Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: konnix_test
          POSTGRES_USER: konnix
          POSTGRES_PASSWORD: konnix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U konnix -d konnix_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compilar e Executar Testes do Backend
        working-directory: ./backend
        env:
          KONNIX_UPLOADS_DIR: target/test-uploads
          KONNIX_TEST_DB_URL: jdbc:postgresql://localhost:5432/konnix_test
          KONNIX_TEST_DB_USER: konnix
          KONNIX_TEST_DB_PASSWORD: konnix
        run: |
          mvn -B clean verify

      - name: Publicar Relatório de Cobertura (JaCoCo)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

  frontend-ci:
    name: Frontend CI (Node 22 / React 19 / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências do Frontend
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps

      - name: Verificar Tipagem e Build de Produção
        working-directory: ./frontend
        run: |
          npm run build

      - name: Executar Testes do Frontend
        working-directory: ./frontend
        run: |
          npm test

      - name: Auditoria de Dependências (alta severidade)
        working-directory: ./frontend
        continue-on-error: true
        run: |
          npm audit --audit-level=high --omit=dev
