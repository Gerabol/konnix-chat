name: CI - Verificação Contínua

on:
  pull_request:
    branches:
      - main
      - homologacao
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'chore/**'

jobs:
  backend-ci:
    name: Backend CI (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compilar e Executar Testes do Backend
        working-directory: ./backend
        run: |
          mvn -B clean verify

  frontend-ci:
    name: Frontend CI (Node 22 / React 19 / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências do Frontend
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps

      - name: Verificar Tipagem e Build de Produção
        working-directory: ./frontend
        run: |
          npm run build
