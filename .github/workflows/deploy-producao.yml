name: Deploy Produção (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy no Servidor Local (Produção)
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar Existência do Arquivo de Ambiente (.env.prod)
        run: node deploy/deploy-helper.js check-prod-env

      - name: Atualizar e Subir Containers de Produção
        run: docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml up -d --build --remove-orphans

      - name: Healthcheck da Aplicação de Produção
        run: node deploy/deploy-helper.js healthcheck-prod
