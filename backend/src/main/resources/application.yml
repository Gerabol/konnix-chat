server:
  port: 8080
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: konnix-chat-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/konnix}
    username: ${SPRING_DATASOURCE_USERNAME:konnix}
    password: ${SPRING_DATASOURCE_PASSWORD:konnix}
    hikari:
      connection-timeout: 20000
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 45000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:-1}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:-1}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

konnix:
  uploads:
    dir: ${KONNIX_UPLOADS_DIR:./uploads}
  files:
    max-size: ${KONNIX_MAX_FILE_SIZE:62914560}
  vapid:
    public-key: ${KONNIX_VAPID_PUBLIC_KEY:}
    private-key: ${KONNIX_VAPID_PRIVATE_KEY:}
    subject: ${KONNIX_VAPID_SUBJECT:mailto:suporte@cge.pb.gov.br}

logging:
  level:
    br.gov.pb.cge.konnix: INFO
